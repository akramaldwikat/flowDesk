packages:
  - apps/*
  - packages/*
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - "@nestjs/common@12.4.0"
  - "@nestjs/core@12.4.0"
  - "@nestjs/jwt@12.0.4"
  - "@nestjs/platform-express@12.4.0"
  - "@isaacs/nonrecursive-glob-match@1.1.0"
  - minimatch@11.0.5

overrides:
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.5"
